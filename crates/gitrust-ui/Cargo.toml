[package]
name = "gitrust-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "gitrust"
path = "src/main.rs"

# Passed straight down; see gitrust-core for what it is for.
[features]
vendored-openssl = ["gitrust-core/vendored-openssl"]

[dependencies]
gitrust-core = { path = "../gitrust-core" }
anyhow.workspace = true
eframe = "0.31"
egui = "0.31"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# The inside of a terminal: the pseudo-terminal on all three systems, the
# reader of what a shell writes, and the grid that writing describes. The
# README says why this one is somebody else's.
alacritty_terminal = "0.26"
